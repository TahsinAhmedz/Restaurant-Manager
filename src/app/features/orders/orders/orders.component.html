<div
  class="rounded-[var(--app-radius)] border border-[var(--app-border)] bg-[var(--app-surface-elevated)] p-6 shadow-[var(--app-shadow)]"
>
  <h2
    class="mb-4 text-xl font-semibold tracking-tight text-[var(--app-text-primary)]"
  >
    {{ 'orders.title' | translate }}
  </h2>
  <app-orders-filters class="mb-5 block" />

  <div class="mt-2">
    @if (store.loading()) {
      <app-loading-spinner />
    } @else if (store.loadError()) {
      <div
        class="flex flex-col items-center justify-center gap-3 rounded-[var(--app-radius-sm)] border border-rose-200 bg-rose-50 px-4 py-8 text-center"
        role="alert"
      >
        <p class="text-sm font-medium text-rose-800">
          {{ store.loadError() | translate }}
        </p>
        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="retryLoadOrders()"
          [attr.aria-label]="'orders.retry' | translate"
        >
          {{ 'orders.retry' | translate }}
        </button>
      </div>
    } @else if (store.totalCount() === 0) {
      <app-empty-state [message]="'orders.empty'" />
    } @else {
      <app-orders-table
        [orders]="store.filteredOrders()"
        [totalCount]="store.totalCount()"
        [pageSize]="store.pagination().pageSize"
        [pageIndex]="store.pagination().pageIndex"
        (orderSelected)="openOrderDetails($event)"
        (pageChange)="store.setPagination($event.pageIndex, $event.pageSize)"
      />
    }
  </div>
</div>
