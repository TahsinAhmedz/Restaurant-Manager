<div class="analytics-card">
  <h2 class="analytics-title">Daily Revenue</h2>
  <p class="analytics-subtitle">Completed orders only</p>

  @if (dailyRevenue().length === 0) {
    <div class="empty-wrap">
      <app-empty-state message="No completed orders for selected filters" />
    </div>
  } @else {
    <div class="analytics-table-wrap">
      <table mat-table [dataSource]="dailyRevenue()" class="w-full">
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let row">{{ row.date }}</td>
        </ng-container>
        <ng-container matColumnDef="orderCount">
          <th mat-header-cell *matHeaderCellDef>Orders</th>
          <td mat-cell *matCellDef="let row">{{ row.orderCount }}</td>
        </ng-container>
        <ng-container matColumnDef="totalRevenue">
          <th mat-header-cell *matHeaderCellDef>Revenue</th>
          <td mat-cell *matCellDef="let row" class="revenue-cell">{{ row.totalRevenue | currency }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" [attr.data-date]="row.date"></tr>
      </table>
    </div>
  }
</div>
